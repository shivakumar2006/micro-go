name: FleetOps CI 

on: 
  push:
    branches: 
      - main 
      - develop 

  pull_request: 
    branches: 
      - main 
      - develop

jobs: 
  test: 
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy: 
      fail-fast: false 
      matrix: 
        service: 
          - api_gateway
          - auth 
          - vehicles
          - cart 
          - orders 
          - payment 
          - inventory 
          - notification 
          - analytics
      
    defaults: 
      run: 
        working-directory: backend/${{ matrix.service }}

    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go 
        uses: actions/setup-go@v5
        with: 
          go-version: "1.26.1"
          cache: true 
          cache-dependency-path: "backend/${{ matrix.service }}/go.sum"

      - name: Download dependencies 
        run: go mod download 
      
      - name: Run tests
        run: go test ./...

      - name: Run vet 
        run: go vet ./...

      - name: Build 
        run: go build ./...