apiVersion: v1 
kind: ConfigMap 
metadata: 
  name: notification-config 
data: 
  config.yaml: |
    server:
      address: ":8086"

    kafka:
      address: "kafka-service:9092"
      topic: "payment-success"
      group_id: "notification-group"

    brevo:
      smtp_host: "smtp-relay.brevo.com"
      smtp_port: 587
      sender_name: "fleet-ops"