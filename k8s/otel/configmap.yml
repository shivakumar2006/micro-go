apiVersion: v1 
kind: ConfigMap 
metadata: 
  name: otel-config
  namespace: default
data: 
  otel-collector-config.yaml: |
    receivers: 
      otlp: 
        protocols: 
          grpc: 
            endpoint: 0.0.0.0:4317
          
          http: 
            endpoint: 0.0.0.0:4318
    
    processors: 
      batch:
    
    exporters: 
      otlp_grpc: 
        endpoint: jaeger-service:4317
        tls: 
          insecure: true
    
    service:
      pipelines:
        traces:
          receivers:
            - otlp
    
          processors:
            - batch
    
          exporters:
            - otlp_grpc