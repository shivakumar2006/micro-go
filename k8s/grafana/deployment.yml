apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: grafana-deployment
  namespace: default
spec: 
  replicas: 1 
  selector: 
    matchLabels: 
      app: grafana 
  template: 
    metadata: 
      labels: 
        app: grafana 
    spec: 
      containers: 
        - name: grafana 
          image: grafana/grafana:latest 
          ports: 
            - containerPort: 3000
              name: http 
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
      volumes: 
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-pvc