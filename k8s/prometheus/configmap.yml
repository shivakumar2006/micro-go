apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        project: "fleetops"

    scrape_configs:
      - job_name: "auth-service"
        static_configs:
          - targets: ["auth-service:8080"]
        metrics_path: "/metrics"
        scrape_interval: 10s

      - job_name: "vehicle-service"
        static_configs:
          - targets: ["vehicle-service:8081"]
        metrics_path: "/metrics"
        scrape_interval: 10s

      - job_name: "cart-service"
        static_configs:
          - targets: ["cart-service:8082"]
        metrics_path: "/metrics"
        scrape_interval: 10s

      - job_name: "order-service"
        static_configs:
          - targets: ["orders-service:8083"]
        metrics_path: "/metrics"
        scrape_interval: 10s

      - job_name: "payment-service"
        static_configs:
          - targets: ["payment-service:8084"]
        metrics_path: "/metrics"
        scrape_interval: 10s

      - job_name: "inventory-service"
        static_configs:
          - targets: ["inventory-service:8085"]
        metrics_path: "/metrics"
        scrape_interval: 10s

      - job_name: "notification-service"
        static_configs:
          - targets: ["notification-service:8086"]
        metrics_path: "/metrics"
        scrape_interval: 10s

      - job_name: "api-gateway"
        static_configs:
          - targets: ["gateway-service:8000"]
        metrics_path: "/metrics"
        scrape_interval: 10s